schema_version: ores.compose.v1
project: lunatic-lorry-desktop
allow_lazy_start: false
source:
  repository: https://github.com/lunatic-lorry/ll-desktop-daemon.git
  commit: 5c3cf0c881912342b81fdbc658cc7dd9ccfb59ea
  checkout_dir: tmp/dev/ll-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release"]
    command: ["./target/release/ll-desktop-daemon"]
    environment:
      LL_DESKTOP_ADDR: "127.0.0.1:8763"
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8763/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
